[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/render",
    "crates/editor",
    "crates/rigging",
    "crates/physics",
    "crates/ai",
    "crates/script",
    "crates/format",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
